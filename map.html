    <!-- The first header of the page -->
    <h1 style="text-align:center;">My WebGIS</h1>

    <!-- This div will hold the complete map -->
	
    <!-- population exposure classes -->

	<div class="interactive-map-wrapper">
	
	  <div id="map"></div>
	
	  <div class="layer-panel">
		<h3>Layer Control</h3>

		<label>Pollution maps for December, 2023</label>
		<label><input type="checkbox" id="no2DecemberCheck" > NO₂ </label>
		<label><input type="checkbox" id="pm10DecemberCheck"> PM₁₀ </label>
		<label><input type="checkbox" id="pm25DecemberCheck"> PM₂.₅ </label>

		<label>Average Map for each Pollutant 2023</label>
		<label><input type="checkbox" id="no2AverageCheck"> NO₂ </label>
		<label><input type="checkbox" id="pm10AverageCheck"> PM₁₀ </label>
		<label><input type="checkbox" id="pm25AverageCheck"> PM₂.₅ </label>

		<label> Concentration Map for each Pollutant 2023</label>
		<label><input type="checkbox" id="no2ConcentrationCheck"> NO₂ </label>
		<label><input type="checkbox" id="pm10ConcentrationCheck"> PM₁₀ </label>
		<label><input type="checkbox" id="pm25ConcentrationCheck"> PM₂.₅ </label>
	
		<label> Annual Mean Aggregation Change (AMAC) Map between 2021 and 2023 </label>
		<label><input type="checkbox" id="no2AmacCheck"> NO₂ </label>
		<label><input type="checkbox" id="pm10AmacCheck"> PM₁₀ </label>
		<label><input type="checkbox"id="pm25AmacCheck"> PM₂.₅ </label>

        <label>Land Cover Change Map from 2021 to 2023 </label>
		<label><input type="checkbox" id="lccCheck"> LCC Map</label>


	
		<label> Population Exposure Bivariate Map for each Pollutant </label>
		<label><input type="checkbox" id="no2BivariateCheck" > NO₂ </label>
		<label><input type="checkbox" id="pm10BivariateCheck"> PM₁₀ </label>
		<label><input type="checkbox" id="pm25BivariateCheck"> PM₂.₅ </label>

		<label>Base Maps</label>

<label>
  <input type="radio" name="basemap" id="osmBase" checked>
  OpenStreetMap
</label>

<label>
  <input type="radio" name="basemap" id="positronBase">
  CartoDB Positron
</label>

<label>
  <input type="radio" name="basemap" id="imageryBase">
  ESRI Gray Light
</label>

<hr>
	</div>
		<div>
	
			<div class="map-legend">
				<h4 id="legendTitle"></h4>
				<img id="legendImage" alt="Layer Legend">
			  </div>
			
	

    </div>
    <button id="toggleCorine" class="custom-button">
        Toggle Corine Layers
    </button>
